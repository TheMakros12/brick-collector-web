spring.application.name=backend
server.port=8080

# Perfil activo por defecto: 'neon' (Base de Datos Cloud Neon PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:neon}

# Configuración Base de Datos Cloud Neon PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-billowing-mouse-as4cdcpq.c-4.eu-central-1.aws.neon.tech:5432/brickcollector?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_v9YhCtHT6lsZ}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000

# Hibernate PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Claves de APIs Externas (Rebrickable & BrickEconomy)
api.rebrickable.key=${REBRICKABLE_API_KEY:f138411743940f84bc3cd94fbdc27848}
api.brickeconomy.key=${BRICKECONOMY_API_KEY:a8e23f6a-6cde-453a-a6a1-b43c8231c90a}

# Optimización de Ancho de Banda (Render Free Tier)
# Compresión Gzip al vuelo para JSONs, JS, CSS y HTML (reduce 70-80% el tamaño de envío)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Caché de recursos estáticos en el navegador (7 días)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

