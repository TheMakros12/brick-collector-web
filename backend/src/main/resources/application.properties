spring.application.name=backend
server.port=8080

# Configuración de Base de Datos PostgreSQL
# IMPORTANTE: Asegúrate de tener una base de datos configurada en tu servidor PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brickcollector}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: Genera el esquema automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Claves de APIs Externas
api.rebrickable.key=${REBRICKABLE_API_KEY:f138411743940f84bc3cd94fbdc27848}
api.brickeconomy.key=${BRICKECONOMY_API_KEY:default-key-replace-me}
