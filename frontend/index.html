<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickCollector Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Theme Detection Script (Run immediately) -->
    <script src="js/theme.js"></script>
    

    <!-- html2pdf.js for PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Chart.js for Profile -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body>
    <div id="app-container">
        <!-- Barra de navegación principal superior -->
        <nav id="main-nav" class="hidden">
            <div class="nav-brand" style="font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px;">
                <i data-lucide="blocks"></i> BrickCollector
            </div>
            <div class="nav-links" style="display: flex; gap: 20px; height: 100%;">
                <button class="nav-btn active" data-view="search">
                    <i data-lucide="search"></i>
                    <span>Buscar</span>
                </button>
                <button class="nav-btn" data-view="collection">
                    <i data-lucide="layers"></i>
                    <span>Mis Legos</span>
                </button>
                <button class="nav-btn" data-view="pieces">
                    <i data-lucide="puzzle"></i>
                    <span>Mis Piezas</span>
                </button>
                <button class="nav-btn" data-view="profile">
                    <i data-lucide="user"></i>
                    <span>Perfil</span>
                </button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="nav-btn" onclick="toggleTheme()" aria-label="Cambiar tema">
                    <i id="theme-icon" data-lucide="moon"></i>
                </button>
            </div>
        </nav>

        <!-- Vistas de la aplicación se renderizarán aquí -->
        <main id="main-content"></main>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JS -->
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
