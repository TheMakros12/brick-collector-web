<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BrickCollector Dashboard</title>
    <link rel="icon" type="image/webp" href="./assets/Lego.webp">
    <link rel="apple-touch-icon" href="./assets/Lego.webp">
    <link rel="manifest" href="manifest.json">
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BrickCollector">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Theme Detection Script (Run immediately) -->
    <script src="js/theme.js"></script>

    <!-- html2pdf.js for PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- ApexCharts for Premium Dashboard Statistics -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <div id="app-container">
        <!-- Barra de navegación / Sidebar principal -->
        <nav id="main-nav" class="hidden">
            <div class="nav-brand-container">
                <img src="Lego.webp" alt="LEGO® Logo" class="nav-logo-img">
                <div class="nav-brand-text">
                    <span class="nav-title">BrickCollector</span>
                    <span class="nav-subtitle"><i data-lucide="blocks" style="width:12px;height:12px;"></i> Gestor LEGO®</span>
                </div>
            </div>

            <div class="nav-links">
                <button class="nav-btn active" data-view="search">
                    <i data-lucide="search"></i>
                    <span>Buscar Sets</span>
                </button>
                <button class="nav-btn" data-view="collection">
                    <i data-lucide="layers"></i>
                    <span>Mi Colección</span>
                </button>
                <button class="nav-btn" data-view="pieces">
                    <i data-lucide="puzzle"></i>
                    <span>Mis Piezas</span>
                </button>
                <button class="nav-btn" data-view="profile">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Estadísticas</span>
                </button>
            </div>

            <div class="nav-footer">
                <button class="theme-toggle-btn-full" onclick="toggleTheme()" aria-label="Cambiar tema">
                    <i id="theme-icon" data-lucide="moon"></i>
                    <span>Modo Oscuro</span>
                </button>
            </div>
        </nav>

        <!-- Vistas de la aplicación se renderizarán aquí -->
        <main id="main-content"></main>

        <!-- Navigation bar inferior para móviles / iPhone -->
        <nav id="mobile-bottom-nav" class="mobile-bottom-nav hidden">
            <button class="mobile-nav-btn active" data-view="search">
                <i data-lucide="search"></i>
                <span>Buscar</span>
            </button>
            <button class="mobile-nav-btn" data-view="collection">
                <i data-lucide="layers"></i>
                <span>Colección</span>
            </button>
            <button class="mobile-nav-btn" data-view="pieces">
                <i data-lucide="puzzle"></i>
                <span>Piezas</span>
            </button>
            <button class="mobile-nav-btn" data-view="profile">
                <i data-lucide="user"></i>
                <span>Perfil</span>
            </button>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JS -->
    <script src="js/storage.js?v=39"></script>
    <script src="js/api.js?v=39"></script>
    <script src="js/ui.js?v=39"></script>
    <script src="js/views/searchView.js?v=39"></script>
    <script src="js/views/collectionView.js?v=39"></script>
    <script src="js/views/piecesView.js?v=39"></script>
    <script src="js/views/statsView.js?v=39"></script>
    <script src="js/app.js?v=39"></script>
</body>
</html>
